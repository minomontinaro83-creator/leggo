<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0f20">
<meta name="robots" content="noindex,nofollow">
<title>Ebook 1000</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,300;0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Atkinson+Hyperlegible:wght@400;700&family=Playfair+Display:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <div class="view" id="v-lib"></div>
  <div class="view" id="v-oggi" hidden></div>
  <div class="view" id="v-cerca" hidden></div>
  <div class="view" id="v-altro" hidden></div>
  <nav class="nav" id="nav">
    <button data-v="lib" aria-current="true"><svg viewBox="0 0 24 24"><path d="M5 4h4v16H5zM10 4h4v16h-4zM15.5 5.5l3.8-1 3 14.5-3.8 1z"/></svg>Libreria</button>
    <button data-v="oggi"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 9h16M9 5v4"/></svg>Oggi</button>
    <button data-v="cerca"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>Cerca</button>
    <button data-v="altro"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>Altro</button>
  </nav>
</div>

<div id="reader" aria-label="Lettore">
  <div class="topprog"><i id="r-tp"></i></div>
  <div class="rtop">
    <button class="ib" id="r-close" aria-label="Chiudi"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
    <button class="rtitle" id="r-title" aria-label="Indice"></button>
    <button class="ib" id="r-ai" aria-label="Chiedi all'AI" style="color:var(--acc)"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM18 16l.8 2.2L21 19l-2.2.8L18 22l-.8-2.2L15 19l2.2-.8z"/></svg></button>
    <button class="ib" id="r-listen" aria-label="Ascolta"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
    <button class="ib" id="r-toc" aria-label="Indice"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.1M4.5 12h.1M4.5 18h.1"/></svg></button>
    <button class="ib" id="r-fmt" aria-label="Aspetto"><svg viewBox="0 0 24 24"><path d="M4 19 9.5 5 15 19M6 14h7M17 8h4M19 6v4M17 18h4"/></svg></button>
  </div>
  <div id="rscroll"><div id="rtext"></div></div>
  <div class="rbot">
    <button class="ib" id="r-prev" aria-label="Precedente"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button>
    <div class="grow"><input type="range" id="r-seek" min="0" max="1000" value="0" aria-label="Avanzamento nel libro"><div class="small tab" id="r-info"></div></div>
    <button class="ib" id="r-next" aria-label="Successivo"><svg viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg></button>
  </div>
</div>

<div id="selbar">
  <div class="row"><div class="sw" id="sb-sw"><button data-c="1" aria-label="Giallo"></button><button data-c="2" aria-label="Verde"></button><button data-c="3" aria-label="Azzurro"></button><button data-c="4" aria-label="Rosa"></button><button data-c="0" aria-label="Togli" style="background:transparent;font-size:16px">×</button></div><div class="grow small mute" id="sb-info" style="text-align:right"></div></div>
  <div class="acts">
    <button id="sb-ai"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM18 16l.8 2.2L21 19l-2.2.8L18 22l-.8-2.2L15 19l2.2-.8z"/></svg>Spiega</button>
    <button id="sb-note"><svg viewBox="0 0 24 24"><path d="M5 4h14v12l-4 4H5zM15 20v-4h4M8 9h8M8 13h5"/></svg>Nota</button>
    <button id="sb-bm"><svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-4-5 4z"/></svg>Segnalibro</button>
    <button id="sb-dif"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17v.1"/></svg>Da capire</button>
    <button id="sb-copy"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="12" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>Copia</button>
    <button id="sb-x"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>Chiudi</button>
  </div>
</div>

<div class="sheet" id="sh"><div class="box" id="sh-box"></div></div>
<div class="toast" id="toast"></div>
<div id="resume" hidden></div>
<div id="imp"><b id="imp-t">Importo…</b><div class="bar"><i id="imp-b" style="width:0"></i></div><div class="small mute" id="imp-s"></div></div>
<input type="file" id="fpick" multiple hidden accept=".epub,.pdf,.docx,.txt,.md,.markdown,.html,.htm,application/epub+zip,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,text/markdown,text/html">

<script src="util.js"></script>
<script src="import.js"></script>
<script src="app.js"></script>
</body>
</html>
